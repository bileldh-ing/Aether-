name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        id: format
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test 2>&1 | tee format.txt

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analyze.txt; exit ${PIPESTATUS[0]}

      - name: Test
        id: test
        continue-on-error: true
        run: flutter test --reporter expanded 2>&1 | tee test.txt; exit ${PIPESTATUS[0]}

      - name: Publish report to ci-reports branch
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/report
          {
            echo "commit: ${GITHUB_SHA}"
            echo "flutter: $(flutter --version | head -1)"
            echo "format: ${{ steps.format.outcome }}"
            echo "analyze: ${{ steps.analyze.outcome }}"
            echo "test: ${{ steps.test.outcome }}"
          } > /tmp/report/summary.txt
          cp format.txt analyze.txt test.txt /tmp/report/ || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin ci-reports || true
          git checkout --orphan ci-reports-tmp
          git rm -rf . > /dev/null
          cp /tmp/report/* .
          git add summary.txt format.txt analyze.txt test.txt
          git commit -m "CI report for ${GITHUB_SHA::7}"
          git push -f origin HEAD:ci-reports

      - name: Fail if any check failed
        if: steps.format.outcome == 'failure' || steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        run: exit 1

  screens:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Render screens
        continue-on-error: true
        run: |
          flutter pub get
          flutter test test_screens --update-goldens 2>&1 | tee screens.txt

      - name: Publish screens to ci-reports
        run: |
          mkdir -p /tmp/screens
          cp test_screens/goldens/*.png /tmp/screens/ 2>/dev/null || true
          cp screens.txt /tmp/screens/ || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for attempt in 1 2 3; do
            git fetch origin ci-reports
            git checkout -B ci-reports origin/ci-reports
            rm -rf screens && mkdir screens && cp /tmp/screens/* screens/
            git add -A screens
            git commit -m "Screens for ${GITHUB_SHA::7}" || exit 0
            git push origin HEAD:ci-reports && exit 0
            sleep 5
          done

  android-apk:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK (debug-signed, demo)
        run: |
          flutter pub get
          flutter build apk --release 2>&1 | tee build.txt; exit ${PIPESTATUS[0]}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-grid-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish build log on failure
        if: failure() && github.event_name == 'push'
        run: |
          cp build.txt /tmp/build.txt || echo "no log" > /tmp/build.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin ci-reports
          git checkout -B ci-reports origin/ci-reports
          cp /tmp/build.txt build.txt
          git add build.txt
          git commit -m "APK build log for ${GITHUB_SHA::7}"
          git push origin HEAD:ci-reports

name: aether_grid
description: Aether Grid — companion app for the Aether Smart Home Power Core.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  # 1.x: 2.x adds a build-time license ping; 1.36+ honours the app compileSdk.
  flutter_blue_plus: ">=1.36.8 <2.0.0"
  mobile_scanner: ^7.4.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.2
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/
